<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0b1224" />
    <title>LumeWorks overzicht</title>
    <link rel="icon" type="image/png" href="assets/blended/favicon.png" />
    <link rel="apple-touch-icon" href="assets/blended/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,600..800;1,6..72,600..800&amp;family=Hanken+Grotesk:ital,wght@0,400..700;1,400..700&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/blended/style.css?v=compact-orders-1" />
  <link rel="stylesheet" href="assets/blended/creator-summary.css?v=1" />
</head>
  <body>
    <a class="skip" href="#analysis">Naar analyse</a>
    <div class="shell">
      <header>
        <a
          class="brand"
          href="blended.html"
          aria-label="LumeWorks · terug naar overzicht"
        >
          <div>
            <img
              class="brand-logo"
              src="assets/blended/lumeworks-logo.svg"
              alt="LumeWorks"
              width="170"
              height="25"
            />
          </div>
        </a>
        <div class="controls">
          <div id="periodPicker"></div>
          <div id="comparisonPicker"></div>
          <div hidden>
            <label
              >Periode<select id="preset">
                <option value="seven">Laatste 7 afgesloten dagen</option>
                <option value="today">Vandaag</option>
                <option value="yesterday">Gisteren</option>
                <option value="month">Deze maand</option>
                <option value="lastmonth">Vorige maand</option>
                <option value="all">Sinds start</option>
                <option value="custom">Aangepast</option>
              </select></label
            ><label
              >Vergelijken<select id="comparison">
                <option value="previous">Vorige periode</option>
                <option value="custom">Eigen periode</option>
                <option value="off">Uit</option>
              </select></label
            >
          </div>
          <button class="quiet" id="statusButton" aria-expanded="false">
            Datastatus ⓘ
          </button>
        </div>
      </header>
      <form id="dates" class="dates" hidden>
        <label>Van<input id="from" type="date" required /></label
        ><label>Tot en met<input id="to" type="date" required /></label
        ><button>Toepassen</button>
      </form>
      <form id="compareDates" class="dates" hidden>
        <label>Vergelijk van<input id="prevFrom" type="date" required /></label
        ><label>Vergelijk tot<input id="prevTo" type="date" required /></label
        ><button>Toepassen</button>
      </form>
      <section
        id="status"
        class="panel"
        hidden
        aria-label="Datastatus"
      ></section>
      <nav id="tabs" role="tablist" aria-label="Weergave"></nav>
      <main id="content" role="tabpanel">
        <div id="loading" class="panel">Gegevens worden geladen…</div>
      </main>
      <footer>
        <span>LumeWorks · Eén overzicht, van omzet naar resultaat</span
        >
      </footer>
    </div>
    <script
      type="module"
      src="assets/blended/app.js?v=returns-audit-1"
    ></script>
  </body>
</html>
