name: Dashboard live health
on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-dashboard-health.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-health-${{ github.run_id }}
          path: dashboard-health.json
          retention-days: 30
