name: Sync creators
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
  push:
    paths: ["scripts/sync_creators.py", ".github/workflows/sync-creators.yml"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: sync-creators
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read and validate creators sheet
        run: python scripts/sync_creators.py
      - name: Save refreshed data
        run: |
          git config user.name 'LumeWorks data sync'
          git config user.email 'actions@users.noreply.github.com'
          git add data/creators.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh creators data'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate latest website before publishing
        run: |
          git pull --rebase origin main
          npm ci
          npm ci --prefix cloudflare-worker
          npm test
      - name: Prepare website files
        run: |
          mkdir -p _site
          cp *.html *.png *.gif _site/
          cp -R assets data _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish refreshed website
        id: deployment
        uses: actions/deploy-pages@v4
