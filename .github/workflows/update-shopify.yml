name: Shopify orders bijwerken

on:
  schedule:
    - cron: '25 * * * *'   # elk uur om :25
  workflow_dispatch:         # ook handmatig te starten

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Shopify orders ophalen en HTML patchen
        env:
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_STORE: lumeworksnl.myshopify.com
        run: |
          python3 - <<'PYEOF'
          import json, os, re, requests
          from datetime import date

          TOKEN = os.environ["SHOPIFY_TOKEN"]
          STORE = os.environ["SHOPIFY_STORE"]
          TEST_CODES = {"pim100", "koen100", "job100"}

          gql = f"https://{STORE}/admin/api/2024-01/graphql.json"
          query = """
          {
            orders(first:50, query:"created_at:>=2026-08-01", sortKey:CREATED_AT) {
              edges { node {
                name createdAt
                totalPriceSet { shopMoney { amount } }
                discountCodes
                lineItems(first:5) { edges { node { title quantity } } }
              }}
            }
          }
          """
          r = requests.post(gql, json={"query": query},
                            headers={"X-Shopify-Access-Token": TOKEN,
                                     "Content-Type": "application/json"}, timeout=20)
          r.raise_for_status()

          orders = []
          for e in r.json()["data"]["orders"]["edges"]:
              n = e["node"]
              items = []
              for li in n["lineItems"]["edges"]:
                  items.extend([li["node"]["title"]] * li["node"]["quantity"])
              code  = (n["discountCodes"] or [""])[0]
              incl  = float(n["totalPriceSet"]["shopMoney"]["amount"])
              test  = code.lower() in TEST_CODES or incl < 10
              o = {"d": n["createdAt"][:10], "num": n["name"],
                   "items": items, "code": code, "incl": incl}
              if test:
                  o["test"] = True
              orders.append(o)

          lines = []
          for o in orders:
              items_js = json.dumps(o["items"])
              test_part = ",test:true" if o.get("test") else ""
              lines.append(
                  f'  {{d:"{o["d"]}",num:"{o["num"]}",items:{items_js},'
                  f'code:"{o["code"]}",incl:{o["incl"]}{test_part}}}'
              )
          block = "const ORDERS_SHOPIFY = [\n" + ",\n".join(lines) + "\n];"

          with open("index.html") as f:
              html = f.read()

          new = re.sub(r'const ORDERS_SHOPIFY\s*=\s*\[[^\]]*\];', block, html, flags=re.DOTALL)
          if new == html:
              print("Geen wijzigingen in orders")
          else:
              with open("index.html", "w") as f:
                  f.write(new)
              print(f"✓ {len(orders)} orders bijgewerkt")
          PYEOF

      - name: Commit en push als er wijzigingen zijn
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "Geen nieuwe orders — skip commit"
          else
            git commit -m "Auto-update Shopify orders $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi
