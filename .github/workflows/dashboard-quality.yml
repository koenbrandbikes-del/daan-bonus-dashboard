name: Dashboard tests
on:
  push:
    paths: ['assets/**', 'tests/**', '*.html', 'cloudflare-worker/**', '.github/workflows/dashboard-quality.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix cloudflare-worker
      - run: npm test
