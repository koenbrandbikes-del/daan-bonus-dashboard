name: Meta-sync watchdog

# Laatste-redmiddel back-up voor de Meta-sync — de strakke 15-minuten-
# cadans wordt sinds 2026-08-18 gedekt door een externe cron-job.org-
# pinger (onafhankelijk, niet in deze repo). Deze workflow draait op
# GitHub's eigen infrastructuur en dient alleen nog als vangnet voor het
# geval cron-job.org uitvalt.
#
# (Ooit ook bedoeld als vangnet vóór Cloudflare's eigen Cron Trigger, die
# op 2026-08-17 stilletjes leek te stoppen. Bleek niet blijvend: een
# latere `wrangler deploy` (19/20 aug) registreerde 'm weer, waardoor er
# ongemerkt TWEE triggers tegelijk draaiden en af en toe met elkaar
# botsten op data/meta.json — zie een cron-job.org faalmail 15 sep 07:00
# UTC. Sindsdien staat die Cron Trigger bewust uit, crons = [] in
# cloudflare-worker/wrangler.toml.)
#
# Interval: elke 30 min (was elke 2 uur). Op 28 sep bleef cron-job.org
# zelf ~1u49 stil terwijl de endpoint bij handmatig testen meteen gewoon
# HTTP 200 gaf — geen codefout, cron-job.org vuurde simpelweg niet. De
# 2-uur-marge liet zo'n stilstand te lang onopgemerkt (de dashboard-
# banner in index.html geeft vanaf 45 min al amber aan); 30 min is nog
# steeds ruim genoeg om niet structureel tegen cron-job.org's eigen
# ~15-min-tik aan te botsen (dat gaf destijds bij 3 bijna-gelijktijdige
# bronnen onnodig veel "some jobs were not successful"-mails van GitHub
# Pages — nu zijn het er nog maar 2, losser getimed).
#
# Faalt deze stap (endpoint niet bereikbaar, of ok:false), dan faalt de
# hele workflow-run — GitHub mailt de repo-eigenaar dan automatisch bij
# een mislukte scheduled workflow, dat is de alarmering.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Meta-sync op de Cloudflare Worker
        run: |
          resp=$(curl -sS --max-time 60 -w '\n%{http_code}' \
            "https://daan-shopify-webhook.koenbrandbikes.workers.dev/run-meta-sync?key=${{ secrets.META_SYNC_KEY }}")
          status="${resp##*$'\n'}"
          body="${resp%$'\n'*}"
          echo "HTTP $status: $body"
          if [ "$status" != "200" ]; then
            echo "::error::Meta-sync endpoint gaf HTTP $status"
            exit 1
          fi
          echo "$body" | grep -q '"ok":true' || { echo "::error::Meta-sync endpoint gaf geen ok:true terug"; exit 1; }
