name = "daan-shopify-webhook"
main = "src/index.js"
compatibility_date = "2026-08-15"
# Vereist door @modelcontextprotocol/sdk (src/mcp.js, sinds 29 sep 2026,
# read-only MCP-server op /mcp) — de SDK raakt bij het inladen Node-
# builtins aan; zonder deze flag faalt de Worker met module-resolution-
# fouten. Geen effect op de bestaande Shopify-webhook/Meta-cron-code.
compatibility_flags = ["nodejs_compat"]

# Google Ads only, every 15 minutes, offset from the external Meta pinger.
# scheduled() MUST NOT call runMetaSync: Meta still uses cron-job.org.
[triggers]
crons = ["7,22,37,52 * * * *"]

# Secrets (NIET hier, via `wrangler secret put`):
#   GITHUB_TOKEN            — fine-grained PAT, alleen repo daan-bonus-dashboard, Contents: Read/write
#   SHOPIFY_WEBHOOK_SECRET  — het gedeelde geheim van Shopify Admin > Instellingen > Meldingen > Webhooks
#   META_ACCESS_TOKEN       — Meta Marketing API system-user token (ads_read)
#   META_SYNC_TRIGGER_KEY   — willekeurige sleutel om de cron ook handmatig te triggeren via GET /run-meta-sync?key=...

#   GOOGLE_ADS_SERVICE_ACCOUNT — JSON key for LumeWorks Ads Reader (read-only in Ads)
